version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.8

    working_directory: ~/project/backend

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            cd backend
            npm ci

      - run:
          name: Generate Prisma Client
          command: |
            cd backend
            npx prisma generate

      - run:
          name: Build
          command: |
            cd backend
            npm run build

      - run:
          name: lint
          command: |
            cd backend
            npm run lint
      - run:
          name: run tests
          command: |
            cd backend
            npm test

workflows:
  version: 2

  build:
    jobs:
      - build
