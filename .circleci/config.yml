version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.8

    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Generate Prisma Client
          command: npx prisma generate

      - run:
          name: Build
          command: npm run build

workflows:
  version: 2

  build:
    jobs:
      - build